name: VPN Control
run-name: "VPN ${{ inputs.action }} [${{ inputs.req }}]"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "VPN Eylemi (start, stop, restart, status, list-peers, remove-peer, add-peer, cleanup)"
        type: choice
        required: true
        default: status
        options:
          - start
          - stop
          - restart
          - status
          - list-peers
          - remove-peer
          - add-peer
          - cleanup
      name:
        description: "Cihaz Adı (add-peer veya remove-peer için)"
        type: string
        required: false
        default: ""
      pubkey:
        description: "İstemci Public Key (add-peer için)"
        type: string
        required: false
        default: ""
      ip:
        description: "İstemci IP Adresi (opsiyonel, örn: 10.13.13.5)"
        type: string
        required: false
        default: ""
      host:
        description: "Hedef Düğüm IP/alan adı (boşsa varsayılan HOST kullanılır)"
        type: string
        required: false
        default: ""
      port:
        description: "Hedef Düğüm SSH Portu"
        type: string
        required: false
        default: ""
      req:
        description: "Panel istek kimliği (run eşleştirme için)"
        type: string
        required: false
        default: ""

permissions: {}

# concurrency grubu yok: GitHub bekleyen ikinci isteği iptal ediyordu.
# Eşzamanlı değişiklikler sunucuda vpnctl içindeki flock ile sıraya alınır.

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run VPN action over SSH
        env:
          HOST: ${{ inputs.host != '' && inputs.host || secrets.HOST }}
          CUSTOM_HOST: ${{ inputs.host }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_PORT: ${{ inputs.port != '' && inputs.port || secrets.SSH_PORT || 22 }}
          ACTION: ${{ inputs.action }}
          PEER_NAME: ${{ inputs.name }}
          PEER_PUBKEY: ${{ inputs.pubkey }}
          PEER_IP: ${{ inputs.ip }}
        run: |
          set -euo pipefail

          # Girdi doğrulama ve enjeksiyon engelleme
          case "$ACTION" in
            start|stop|restart|status|list-peers|remove-peer|add-peer|cleanup) ;;
            *) echo "Geçersiz eylem: $ACTION" >&2; exit 1 ;;
          esac
          if ! [[ "$HOST" =~ ^([0-9]{1,3}(\.[0-9]{1,3}){3}|[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+)$ ]]; then
            echo "Hata: Geçersiz hedef host." >&2; exit 1
          fi
          if ! [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || [ "$SSH_PORT" -lt 1 ] || [ "$SSH_PORT" -gt 65535 ]; then
            echo "Hata: Geçersiz SSH portu." >&2; exit 1
          fi
          if [ -n "$PEER_NAME" ] && ! [[ "$PEER_NAME" =~ ^[A-Za-z0-9_-]{1,32}$ ]]; then
            echo "Hata: Geçersiz peer adı formatı." >&2; exit 1
          fi
          if [ -n "$PEER_PUBKEY" ] && ! [[ "$PEER_PUBKEY" =~ ^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$ ]]; then
            echo "Hata: Geçersiz public key formatı." >&2; exit 1
          fi
          if [ -n "$PEER_IP" ] && ! [[ "$PEER_IP" =~ ^10\.13\.13\.([2-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-4])$ ]]; then
            echo "Hata: Geçersiz peer IP formatı." >&2; exit 1
          fi
          case "$ACTION" in
            add-peer)    [ -n "$PEER_NAME" ] && [ -n "$PEER_PUBKEY" ] || { echo "Hata: add-peer için name ve pubkey gerekli." >&2; exit 1; } ;;
            remove-peer) [ -n "$PEER_NAME" ] || { echo "Hata: remove-peer için name gerekli." >&2; exit 1; } ;;
          esac

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_vpn
          chmod 600 ~/.ssh/id_vpn

          # Host key sabitleme: varsayılan sunucu için SSH_HOST_KEY secret'ı kullanılır.
          if [ -n "$SSH_HOST_KEY" ] && [ -z "$CUSTOM_HOST" ]; then
            printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_HOST_KEY tanımlı değil veya özel düğüm seçildi; host key ilk bağlantıda güvenilir kabul ediliyor (MITM koruması yok)."
            ssh-keyscan -p "$SSH_PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

          COMMAND="$ACTION"
          for arg in "$PEER_NAME" "$PEER_PUBKEY" "$PEER_IP"; do
            if [ -n "$arg" ]; then COMMAND="$COMMAND $arg"; fi
          done

          ssh -i ~/.ssh/id_vpn \
              -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=yes \
              "$USERNAME@$HOST" "$COMMAND"
